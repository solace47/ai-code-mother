spring:
  # session 配置
  session:
    store-type: redis
    # session 30 天过期
    timeout: 2592000
  application:
    name: ai-code-mother-backend
  # 数据库和 Redis 配置已移至 application-dev.yml
  # 请参考 application-dev.yml.example 创建你的开发环境配置
  data:
    redis:
      ttl: 3600 # 缓存存活时间
  profiles:
    active: dev

server:
  port: 8123
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.spring.aicodemother.controller
# knife
knife4j:
  enable: true
  setting:
    language: zh_cn
# 以下敏感配置已移至 application-dev.yml
# 包括：COS、Pexels、Pixabay、DashScope、AI 模型等的 API Key
# 请参考 application-dev.yml.example 创建你的开发环境配置文件
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always





